name: CI

on:
  # Feature branches are covered by their pull request; limiting pushes to the
  # long-lived branches keeps a PR from running the pipeline twice. Release and
  # hotfix pushes run too because they distribute the sample app.
  push:
    branches: [main, dev, 'release**', 'hotfix**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble:
    name: Assemble
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest-large' }}
    env:
      GOOGLE_SERVICES_KEY: ${{ secrets.GOOGLE_SERVICES_KEY }}
      GOOGLE_SERVICES_IV: ${{ secrets.GOOGLE_SERVICES_IV }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-env
      - name: Decrypt sample app secrets
        run: bundle exec fastlane decrypt_google_services
      - name: Assemble the project
        run: bundle exec fastlane assemble
      - name: Upload instrumentation test APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: androidtest-apks
          path: |
            verify/build/outputs/apk/androidTest/debug/verify-debug-androidTest.apk
            security/build/outputs/apk/androidTest/debug/security-debug-androidTest.apk
          if-no-files-found: error

  lint:
    name: Lint
    needs: [assemble]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest-large' }}
    permissions:
      contents: read
      pull-requests: write # danger_check comments on the PR
      statuses: write # danger_check reports the danger/Linter status
    env:
      GOOGLE_SERVICES_KEY: ${{ secrets.GOOGLE_SERVICES_KEY }}
      GOOGLE_SERVICES_IV: ${{ secrets.GOOGLE_SERVICES_IV }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Danger diffs the PR against its base branch
      - uses: ./.github/actions/setup-build-env
      - name: Decrypt sample app secrets
        run: bundle exec fastlane decrypt_google_services
      - name: Run ktlint
        run: bundle exec fastlane lint_checker
      # Skipped for PRs from forks: GitHub gives them a read-only token, so Danger can't comment or set its status.
      - name: Danger check
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: bundle exec fastlane danger_check
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-reports
          path: |
            verify/build/reports
            sample/build/reports
            security/build/reports
          if-no-files-found: warn

  unit_tests:
    name: Unit tests
    needs: [assemble]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest-large' }}
    permissions:
      contents: read
      pull-requests: write # code_coverage_report comments on the PR
      statuses: write # code_coverage_report reports its danger status
    env:
      GOOGLE_SERVICES_KEY: ${{ secrets.GOOGLE_SERVICES_KEY }}
      GOOGLE_SERVICES_IV: ${{ secrets.GOOGLE_SERVICES_IV }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Danger diffs the PR against its base branch
      - uses: ./.github/actions/setup-build-env
      - name: Decrypt sample app secrets
        run: bundle exec fastlane decrypt_google_services
      - name: Run unit tests with coverage
        run: bundle exec fastlane unit_tests
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            verify/build/test-results/testDebugUnitTest/
            security/build/test-results/testDebugUnitTest/
            sample/build/test-results/testDebugUnitTest/
          if-no-files-found: error
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            verify/build/reports/kover
            security/build/reports/kover
          if-no-files-found: error
      # Informational, so a reporter failure does not fail the job.
      - name: Report code coverage
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        continue-on-error: true
        env:
          DANGER_GITHUB_API_TOKEN: ${{ github.token }}
        run: bundle exec danger --danger_id=code_coverage_report --dangerfile=dangerfiles/code_coverage_reporter

  size_report:
    name: Size report
    needs: [unit_tests]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest-large' }}
    env:
      GOOGLE_SERVICES_KEY: ${{ secrets.GOOGLE_SERVICES_KEY }}
      GOOGLE_SERVICES_IV: ${{ secrets.GOOGLE_SERVICES_IV }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-env
      - name: Decrypt sample app secrets
        run: bundle exec fastlane decrypt_google_services
      - name: Generate the size report
        run: bundle exec fastlane sdk_sizer
      - name: Upload size report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: size-report
          path: verify/build/outputs/sizeReport/
          if-no-files-found: error

  instrumentation_tests:
    name: Instrumentation tests (${{ matrix.module }})
    needs: [lint, unit_tests]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest-large' }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: verify
            ftl_config: ftl/verify-ftl-config.yaml
            ftl_group: twilio-verify-tests
          - module: security
            ftl_config: ftl/security-ftl-config.yaml
            ftl_group: twilio-security-tests
    env:
      TEST_APK: ${{ matrix.module }}/build/outputs/apk/androidTest/debug/${{ matrix.module }}-debug-androidTest.apk
      FTL_CONFIG: ${{ matrix.ftl_config }}
      FTL_GROUP: ${{ matrix.ftl_group }}
      CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download instrumentation test APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: androidtest-apks
      - uses: ./.github/actions/setup-gcloud
        with:
          service-account-key: ${{ secrets.GCLOUD_SERVICE_KEY }}
          project: twilioverify-sampleapp
      # A quick single-device run gates the slower multi-device matrix.
      - name: Run on a single device
        run: >-
          gcloud firebase test android run
          --type instrumentation
          --app ftl/dummy.apk
          --test "$TEST_APK"
          --device model=shiba,version=36,locale=en,orientation=portrait
      - name: Run on multiple devices
        run: |
          sed -i -e "s|{{test_build}}|$TEST_APK|g" "$FTL_CONFIG"
          gcloud firebase test android run "$FTL_CONFIG:$FTL_GROUP"

  distribute_sample_app:
    name: Distribute sample app
    needs: [instrumentation_tests]
    # Only builds that reach dev, release or hotfix go to testers, never PR runs.
    if: >-
      github.event_name == 'push' && (
        github.ref == 'refs/heads/dev' ||
        startsWith(github.ref, 'refs/heads/release') ||
        startsWith(github.ref, 'refs/heads/hotfix'))
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest-large' }}
    timeout-minutes: 45
    env:
      GOOGLE_SERVICES_KEY: ${{ secrets.GOOGLE_SERVICES_KEY }}
      GOOGLE_SERVICES_IV: ${{ secrets.GOOGLE_SERVICES_IV }}
      GCLOUD_APP_DISTRIBUTION_SERVICE_KEY: ${{ secrets.GCLOUD_APP_DISTRIBUTION_SERVICE_KEY }}
      SAMPLE_APP_FIREBASE_ID: ${{ secrets.SAMPLE_APP_FIREBASE_ID }}
      FIREBASE_APP_DISTRIBUTION_GROUP: ${{ secrets.FIREBASE_APP_DISTRIBUTION_GROUP }}
      DEV_URL: ${{ secrets.DEV_URL }}
      STAGE_URL: ${{ secrets.STAGE_URL }}
      PROD_URL: ${{ secrets.PROD_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version name comes from the commits since the last tag
      - uses: ./.github/actions/setup-build-env
      - name: Decrypt sample app secrets
        run: bundle exec fastlane decrypt_google_services
      - name: Install the App Distribution key
        run: bundle exec fastlane install_app_distribution_key
      # The URL is wrapped in escaped quotes because it becomes a Java string
      # literal in BuildConfig.
      - name: Distribute the DEV build
        run: bundle exec fastlane distribute_debug_sample_app env:DEV url:"\"$DEV_URL\""
      - name: Distribute the STAGE build
        run: bundle exec fastlane distribute_debug_sample_app env:STAGE url:"\"$STAGE_URL\""
      - name: Distribute the PROD build
        run: bundle exec fastlane distribute_debug_sample_app env:PROD url:"\"$PROD_URL\""
      - name: Remove the App Distribution key
        if: always()
        run: rm -f "$HOME/gcloud-app-distribution-service-key.json"
