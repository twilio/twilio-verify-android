twilio-security-tests:
    timeout: 30m
    type: instrumentation
    app: ftl/dummy.apk
    test: {{test_build}}
    device:
        # Pixel 2 (virtual) - lowest API level Test Lab offers
        - {model: Pixel2.arm, version: 26, locale: en, orientation: portrait}
        # Pixel2
        - {model: Pixel2.arm, version: 28, locale: en, orientation: portrait}
        # Pixel 5e
        - {model: redfin, version: 30, locale: en, orientation: portrait}
        # Google Oriole
        - {model: oriole, version: 31, locale: en, orientation: portrait}
        # Pixel 7
        - {model: panther, version: 33, locale: en, orientation: portrait}
        # Pixel 8
        - {model: shiba, version: 34, locale: en, orientation: portrait}
        # Pixel 9
        - {model: tokay, version: 35, locale: en, orientation: portrait}
